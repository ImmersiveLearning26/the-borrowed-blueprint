<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The Borrowed Blueprint</title><link rel="stylesheet" href="styles.css"></head>
<body><div id="app"><div id="mapStage" aria-label="Continuous atlas from Spain to Nigeria"><svg id="atlas" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Atlas"></svg><div id="markers"></div></div>
<header><div id="status"></div><nav aria-label="Tools"><button id="notes" aria-label="Brief notes" title="Brief notes" style="--i:3">▤</button><button id="sound" aria-label="Mute sound" title="Sound" style="--i:2">♪</button><button id="cc" aria-label="Show captions" title="Captions" aria-pressed="false" style="--i:1">CC</button><button id="settings" aria-label="Settings" title="Settings" style="--i:0">⚙</button><button id="menu" aria-label="Menu" title="Menu"><svg viewBox="0 0 256 256" width="20" height="20" aria-hidden="true"><circle cx="60" cy="128" r="18"/><circle cx="128" cy="128" r="18"/><circle cx="196" cy="128" r="18"/></svg></button></nav></header>
<main id="actions" aria-label="Current task"></main><section id="character" aria-label="Character audio"></section><div id="guide" aria-label="Guide audio"></div><section id="caption" aria-live="polite" hidden></section><div id="toast" role="status"></div><section id="ending" aria-labelledby="endTitle"></section><section id="film" aria-label="Explainer film"></section>
<dialog id="drawer" aria-labelledby="drawerTitle"><div class="drawer-head"><button class="back" type="button" hidden><svg viewBox="0 0 256 256" width="16" height="16" aria-hidden="true"><path d="M160 48l-80 80 80 80" fill="none" stroke="currentColor" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/></svg><span></span></button><h2 class="drawer-title" id="drawerTitle"></h2><button class="icon close" aria-label="Close menu"><img src="assets/icons/x.svg" alt="" width="16" height="16"></button></div><div id="drawerBody"></div></dialog><div id="dev" hidden></div></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><linearGradient id="waveGradient" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="0"><stop stop-color="#55c9ef"/><stop offset=".5" stop-color="#b4b0f7"/><stop offset="1" stop-color="#df8bcf"/></linearGradient>
<!-- Liquid glass: low-frequency noise, softened, displaces the blurred backdrop like a lens (after lucasromerodb/liquid-glass-effect-macos). -->
<filter id="glass-distortion" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox"><feTurbulence type="fractalNoise" baseFrequency="0.01 0.01" numOctaves="1" seed="5" result="turbulence"/><feGaussianBlur in="turbulence" stdDeviation="3" result="softMap"/><feDisplacementMap in="SourceGraphic" in2="softMap" scale="150" xChannelSelector="R" yChannelSelector="G"/></filter></defs></svg>
<script type="module" src="app.js"></script></body></html>
